ShortDescription: Run AI coding agents (Claude Code, Codex, Antigravity…) side by side on an infinite canvas, each in a real terminal.
Description: |-
  A lightweight, native Windows app that runs AI coding agents side by side on an infinite canvas, each in its own
  real terminal (Windows Terminal's control). It shows which agent works and which waits for you, answers permission
  prompts from outside the terminal, notifies you while you're in another app, and shows the agents' changes as a diff.
