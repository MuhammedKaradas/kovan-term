# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.9.0.schema.json
# Installer manifest: the small zip (needs the .NET 10 Desktop Runtime, which winget installs as a dependency).
# {sha256} is in the release's KovanTerm-{version}-win-x64-small.zip.sha256.
PackageIdentifier: MuhammedKaradas.KovanTerm
PackageVersion: {version}
MinimumOSVersion: 10.0.18362.0
InstallerType: zip
NestedInstallerType: portable
NestedInstallerFiles:
  - RelativeFilePath: KovanTerm.exe
    PortableCommandAlias: kovan
Dependencies:
  PackageDependencies:
    - PackageIdentifier: Microsoft.DotNet.DesktopRuntime.10
ReleaseDate: {date}
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/MuhammedKaradas/kovan-term/releases/download/v{version}/KovanTerm-{version}-win-x64-small.zip
    InstallerSha256: {sha256}
ManifestType: installer
ManifestVersion: 1.9.0
