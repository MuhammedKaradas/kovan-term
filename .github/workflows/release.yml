name: Release

# On a v* tag: test → self-contained win-x64 package → zip + SHA256 → draft GitHub Release.
# On PRs that change the release setup, the package is only built and uploaded as an artifact (no release).
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - src/KovanTerm/KovanTerm.csproj

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $v = $env:GITHUB_REF_NAME.TrimStart('v') } else { $v = '0.0.0-pr' }
          "version=$v" >> $env:GITHUB_OUTPUT
          "file=KovanTerm-$v-win-x64" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test -c Release

      - name: Publish
        run: >
          dotnet publish src/KovanTerm -c Release -r win-x64 --self-contained
          -p:Version=${{ steps.version.outputs.version }} -o dist/${{ steps.version.outputs.file }}

      - name: Zip and SHA256
        shell: pwsh
        run: |
          $name = '${{ steps.version.outputs.file }}'
          Compress-Archive -Path "dist/$name/*" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Out-File "dist/$name.zip.sha256" -Encoding ascii
          "{0:N1} MB, SHA256 {1}" -f ((Get-Item "dist/$name.zip").Length / 1MB), $hash

      - name: Artifact (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.file }}
          path: dist/${{ steps.version.outputs.file }}.zip
          retention-days: 7

      - name: Draft release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = '${{ steps.version.outputs.file }}'
          $prerelease = if ('${{ steps.version.outputs.version }}'.Contains('-')) { '--prerelease' } else { '' }
          gh release create $env:GITHUB_REF_NAME "dist/$name.zip" "dist/$name.zip.sha256" `
            --draft --generate-notes --title "Kovan Term $env:GITHUB_REF_NAME" $prerelease
